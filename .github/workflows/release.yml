name: Release APKs
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID whose 'apks' artifact to release"
        required: true
      tag:
        description: "Release tag to create"
        required: true
      title:
        description: "Release title"
        required: true
      notes:
        description: "Release notes"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          gh release create "${{ inputs.tag }}" \
            --repo ${{ github.repository }} \
            --title "${{ inputs.title }}" \
            --notes "${{ inputs.notes }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            patched-*.apk microG-GmsCore.apk patches-version.txt
